<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>STP handle fixture</title>
    <style>
      body {
        font: 24px/1.6 sans-serif;
      }
      #p {
        margin: 120px 80px;
      }
      #ta {
        display: block;
        margin: 80px;
        width: 600px;
        height: 140px;
        font: 24px/1.6 sans-serif;
      }
    </style>
  </head>
  <body>
    <p id="p">
      <span id="w0">The</span> <span id="w1">quick</span> <span id="w2">brown</span>
      <span id="w3">fox</span> <span id="w4">jumps</span>
    </p>
    <textarea id="ta">The quick brown fox jumps</textarea>
    <p id="multi" style="width: 160px; margin: 60px 80px">
      <span id="m0">alpha</span> <span id="m1">beta</span> <span id="m2">gamma</span>
      <span id="m3">delta</span> <span id="m4">epsilon</span> <span id="m5">zeta</span>
    </p>
    <div id="sentinel" style="width: max-content">SENTINEL</div>
    <div id="below" style="height: 400px"></div>
  </body>
</html>
